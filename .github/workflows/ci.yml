# Phase 1 — base CI gates.
# Runs on every PR and every push to main. These three checks are the
# foundation every later security scanner builds on: if the code doesn't
# typecheck, lint, and build, no scan result is trustworthy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# A newer push to the same PR/branch cancels the older, still-running job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (not a mutable tag like @v4)
      # to remove supply-chain risk: a tag can be repointed at malicious code,
      # a SHA cannot. Dependabot (github-actions) bumps these and updates the
      # trailing version comment on each release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # npm ci installs exactly what package-lock.json pins — reproducible,
      # and it fails if package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
