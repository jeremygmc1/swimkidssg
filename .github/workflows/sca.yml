# Phase 3 — Software Composition Analysis (SCA), the CI half.
#
# Dependabot (see .github/dependabot.yml) opens update PRs; this workflow is the
# other half: it scans the dependency tree on every PR/push for KNOWN
# vulnerabilities so a CVE is caught in CI, not just when someone runs a scan by
# hand. Two independent scanners (defence in depth — they disagree):
#   - npm audit  : Node advisory database, fast, no external action.
#   - Trivy (fs) : second opinion + SARIF into the Security tab.
#
# Report-only for now: both steps use continue-on-error so findings never block a
# merge while the baseline is triaged. The npm-audit baseline is already clean
# (0 vulns as of the #25 remediation), so this is close to gate-ready — promote
# by removing continue-on-error and adding the check to branch protection.
name: SCA

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly (Mondays 04:37 UTC): catch CVEs newly disclosed against deps that
    # haven't changed since the last push.
    - cron: '37 4 * * 1'

permissions:
  contents: read
  security-events: write # Trivy SARIF upload to Code scanning

concurrency:
  group: sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Report-only during rollout. --audit-level=high fails only on High/Critical
      # advisories; continue-on-error keeps that non-blocking for now.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  trivy-fs:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ignore-unfixed: only report vulns that actually have a fix available.
      # No exit-code set, so Trivy reports without failing the job (report-only).
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@404bd795832c959ffb8efae2b1b4cc1aafc82058 # v3.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy
