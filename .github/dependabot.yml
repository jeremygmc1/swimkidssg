# Phase 1 — Software Composition Analysis (SCA), the automated half.
# Dependabot watches our dependencies for new versions (and, together with
# GitHub's advisory database, for known vulnerabilities) and opens PRs to
# bump them. CI then runs on those PRs, so an update only merges if it builds.
version: 2
updates:
  # First-party npm dependencies.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group low-risk patch/minor bumps into one PR to cut review noise;
    # major bumps stay separate so breaking changes get their own review.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # The GitHub Actions we pin in .github/workflows are dependencies too —
  # keep them patched so the pipeline itself doesn't rot or ship a known CVE.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
